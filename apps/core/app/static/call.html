<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapNet — 능력 호출</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<header>
  <h1>CapNet</h1>
  <span class="sub">능력 호출</span>
  <nav>
    <a href="/ui/nodes.html">Node</a>
    <a href="/ui/call.html" class="on">능력 호출</a>
    <a href="/ui/invite.html">초대 발행</a>
    <a href="/ui/redeem.html">초대 소진</a>
  </nav>
</header>

<main>
  <div id="keybar"></div>

  <section>
    <h2>요청</h2>
    <p class="hint">
      <b>모델 이름이 아니라 능력으로 요청한다.</b> 어느 기기가 실행할지, 어떤 Agent가 붙을지는 Core가 정한다.
    </p>

    <div class="row">
      <div><label for="c-cap">능력</label><select id="c-cap"><option>불러오는 중…</option></select></div>
      <div><label for="c-dataset">데이터셋</label><select id="c-dataset"></select></div>
      <div><label for="c-case">케이스 ID</label><input id="c-case" value="ic1-0001" placeholder="ic1-0001"></div>
    </div>
    <div class="row">
      <div style="flex:0 0 auto"><button id="c-submit">호출</button></div>
      <div style="flex:0 0 auto"><button class="ghost" id="c-adv">증명 모드…</button></div>
    </div>

    <div id="c-advbox" style="display:none">
      <div class="row"><div>
        <label for="c-agent">Agent 지정 (UC-7 증명용)</label>
        <input id="c-agent" class="mono" placeholder="agent uuid — 비우면 Core가 고른다">
      </div></div>
      <div class="note">
        보통은 비워 둔다. Agent를 지정하는 것은 <b>증명 모드</b>다 —
        같은 케이스를 두 Agent로 교차 실행해 비교할 때 쓴다. 지정해도 게이트 통과는 그대로 강제된다.
      </div>
    </div>

    <p class="err" id="c-err"></p>
  </section>

  <section id="c-outbox" style="display:none">
    <h2>결과</h2>
    <div id="c-out"></div>
  </section>

  <section>
    <h2>최근 호출</h2>
    <p class="hint">이 브라우저에서 보낸 것만 보인다. 서버 이력이 아니다.</p>
    <div class="scroll"><table>
      <thead><tr><th>시각</th><th>케이스</th><th>결과</th><th>기기</th><th>상태</th></tr></thead>
      <tbody id="c-hist"><tr><td colspan="5" class="empty">아직 없다.</td></tr></tbody>
    </table></div>
  </section>
</main>

<script src="/ui/app.js"></script>
<script>
mountKeyBar("keybar");
const hist = [];

async function loadOptions() {
  try {
    const caps = await api("/v1/capabilities");
    $("c-cap").innerHTML = (caps.items || []).map(c =>
      `<option value="${esc(c.code)}|${c.version}">${esc(c.code)}@${c.version} · ${esc(c.trust_domain_min)} 이상</option>`
    ).join("") || '<option value="">(없음)</option>';
  } catch (e) { $("c-cap").innerHTML = `<option>${esc(e.message)}</option>`; }
  try {
    const ds = await api("/v1/datasets");
    $("c-dataset").innerHTML = (ds.items || []).map(d => `<option>${esc(d)}</option>`).join("");
  } catch { $("c-dataset").innerHTML = '<option>eurosat-rgb</option>'; }
}

$("c-adv").onclick = () => {
  const b = $("c-advbox");
  b.style.display = b.style.display === "none" ? "block" : "none";
};

function renderHist() {
  $("c-hist").innerHTML = hist.length ? hist.map(h => `<tr>
    <td class="mono">${esc(h.at)}</td><td class="mono">${esc(h.caseId)}</td>
    <td>${h.label ? esc(h.label) : '<span class="muted">—</span>'}</td>
    <td class="mono muted">${esc((h.node || "").slice(0, 8))}</td>
    <td>${h.ok ? '<span class="pill ok">완료</span>'
              : (h.dummy ? '<span class="pill warn">dummy</span>' : '<span class="pill bad">실패</span>')}</td>
  </tr>`).join("") : '<tr><td colspan="5" class="empty">아직 없다.</td></tr>';
}

$("c-submit").onclick = async () => {
  $("c-err").textContent = "";
  const caseId = $("c-case").value.trim();
  if (!caseId) { $("c-err").textContent = "케이스 ID가 필요하다."; return; }
  const [code, version] = ($("c-cap").value || "image.classify|1").split("|");
  const agent = $("c-agent").value.trim();

  $("c-submit").disabled = true;
  $("c-outbox").style.display = "block";
  $("c-out").innerHTML = '<p class="spin">배정을 기다리는 중…</p>';

  const body = {
    datasetId: $("c-dataset").value, caseId,
    capability_code: code, capability_version: Number(version),
  };
  if (agent) body.requestedAgentId = agent;

  const at = new Date().toTimeString().slice(0, 8);
  try {
    const task = await api("/v1/tasks", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
    });
    let t = null;
    for (let i = 0; i < 90; i++) {
      t = await api(`/v1/tasks/${task.id}`);
      if (t.status === "COMPLETED" || t.status === "FAILED") break;
      await new Promise(r => setTimeout(r, 1000));
    }
    if (!t || (t.status !== "COMPLETED" && t.status !== "FAILED")) {
      throw new Error(`시간 초과 — status=${t ? t.status : "?"}\n배정이 안 됐다면 사슬을 본다: 게이트·바인딩·증서.`);
    }
    if (t.status === "FAILED") throw new Error("실행 실패 (status=FAILED)");

    const res = typeof t.result_ref === "string" ? JSON.parse(t.result_ref) : (t.result_ref || {});
    const a = t.assignment || {};
    const dummy = !!res.dummy;
    $("c-out").innerHTML = `
      <p class="big">${esc(res.label ?? "—")}</p>
      ${dummy ? `<div class="note bad"><b>dummy = true — 실제 추론이 아니다.</b>
        placeholder 가중치로 실행됐다. 이 라벨은 입력 해시에서 만든 값이지 예측이 아니다.</div>` : ""}
      <dl class="result">
        ${res.confidence != null ? `<dt>confidence</dt><dd>${Number(res.confidence).toFixed(4)}</dd>` : ""}
        <dt>기기</dt><dd>${esc(a.node_id)}</dd>
        <dt>Agent</dt><dd>${esc(a.agent_id)}</dd>
        <dt>가중치</dt><dd>${esc((res.weights_sha256 || "").slice(0, 32))}…</dd>
        <dt>Task</dt><dd>${esc(t.id)}</dd>
      </dl>
      <div class="note ${dummy ? "warn" : "ok"}">
        증적이다 — 누가·무엇으로·어디서 실행했는지가 DB에 남고 조회된다.
      </div>`;
    hist.unshift({ at, caseId, label: res.label, node: a.node_id, ok: !dummy, dummy });
  } catch (e) {
    $("c-out").innerHTML = `<p class="err">${esc(e.message)}</p>`;
    hist.unshift({ at, caseId, label: null, node: "", ok: false, dummy: false });
  } finally {
    $("c-submit").disabled = false;
    hist.splice(12);
    renderHist();
  }
};

loadOptions();
</script>
</body>
</html>
