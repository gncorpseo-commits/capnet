openapi: 3.0.3
info:
  title: CapNet Core
  version: 0.3.0
  description: |
    CapNet Core API 초안. 실행 중 스키마는 `GET /openapi.json` · Swagger `GET /docs`.
    claim·gate_run·assignment는 INSERT…SELECT. Node는 큐를 pull하지 않는다.
    Capability 런타임 등록: POST /v1/capabilities.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Core·Postgres·시드 Capability 상태
      responses:
        "200":
          description: OK
  /v1/capabilities:
    get:
      summary: Capability 목록
      responses:
        "200":
          description: items[]
    post:
      summary: Capability 런타임 등록 (UNIQUE code+version, mvp CHECK)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityCreate"
      responses:
        "200":
          description: 생성된 Capability
        "400":
          description: 검증·CHECK 거부
        "409":
          description: (code, version) 중복
  /v1/capabilities/{capability_id}:
    get:
      summary: Capability 단건
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Capability
        "404":
          description: 없음
  /v1/agents:
    get:
      summary: Agent 목록
      responses:
        "200":
          description: items[]
    post:
      summary: Agent 등록 (safetensors만, .pt/.pth 거부)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "200":
          description: 생성된 Agent
        "400":
          description: 형식·해시 거부
  /v1/agents/{agent_id}:
    get:
      summary: Agent 단건 + capabilities
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent
        "404":
          description: 없음
  /v1/agents/{agent_id}/bindings:
    post:
      summary: Node 바인딩 → READY(해시 일치 시)
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindBody"
      responses:
        "200":
          description: binding + ready
  /v1/nodes:
    get:
      summary: Node 목록
      responses:
        "200":
          description: items[]
    post:
      summary: Node 등록 (등급은 Core가 부여, 자기주장 경로 없음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "200":
          description: 생성된 Node
  /v1/nodes/{node_id}:
    get:
      summary: Node 단건
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node
        "404":
          description: 없음
  /v1/tasks:
    post:
      summary: Task 생성 (allowlist datasetId만)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "200":
          description: Task
        "400":
          description: datasetId 거부
  /v1/tasks/{task_id}:
    get:
      summary: Task·현재 assignment·result_ref
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
        "404":
          description: 없음
  /v1/nodes-liveness:
    get:
      summary: 기기 생존·가용 상태 (배정 근거)
      description: >
        heartbeat 신선도 · availability · 진행 중 배정 수.
        Core 워커는 살아 있고 덜 바쁜 기기에만 배정한다.
      responses:
        "200":
          description: 기기별 생존 상태 목록
  /v1/internal/nodes/{node_id}/heartbeat:
    post:
      summary: 기기 생존·가용 신고
      description: >
        AVAILABLE / BUSY / DRAINING / OFFLINE.
        신고가 끊기면(heartbeat_timeout_s 초과) 배정 후보에서 빠진다.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availability:
                  type: string
                  enum: [AVAILABLE, BUSY, DRAINING, OFFLINE]
                metrics:
                  type: object
                  nullable: true
      responses:
        "200":
          description: 세션 갱신됨
        "400":
          description: 알 수 없는 availability
  /v1/internal/nodes/{node_id}/assignments:
    get:
      summary: 기기가 **자기에게 배정된** 살아 있는 lease를 가져간다
      description: >
        큐 pull이 아니다. 배치는 Core 워커가 이미 끝냈고 여기서는 결과만 전달한다.
        이 경로 덕분에 Core가 기기로 들어갈 필요가 없다 (NAT).
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: LEASED 배정 목록 (weights_sha256 · input_ref 포함)
  /v1/internal/claim:
    post:
      summary: Core 전용 claim (FOR UPDATE SKIP LOCKED)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimBody"
      responses:
        "200":
          description: LEASED assignment 또는 빈 큐
  /v1/internal/assignments/{assignment_id}/complete:
    post:
      summary: Node 결과 보고 → SUCCEEDED/COMPLETED
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteBody"
      responses:
        "200":
          description: 완료
        "409":
          description: lease·해시 불일치
  /v1/internal/gate-runs:
    post:
      summary: gate_run 시작 (team gate-runner만)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateStartBody"
      responses:
        "200":
          description: RUNNING
        "409":
          description: runner 아님·거부
  /v1/internal/gate-runs/{gate_run_id}:
    get:
      summary: gate_run 조회
      parameters:
        - $ref: "#/components/parameters/GateRunId"
      responses:
        "200":
          description: gate_run
        "404":
          description: 없음
  /v1/internal/gate-runs/{gate_run_id}/finish:
    post:
      summary: |
        게이트 종료. dummy=false는 실채점.
        S3 — golden_set_sha256가 gate_run 스냅샷과 불일치하면 거부.
        실게이트는 golden_set_sha256 필수.
      parameters:
        - $ref: "#/components/parameters/GateRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateFinishBody"
      responses:
        "200":
          description: 종료·사슬 mint 여부
        "400":
          description: 지표·sha256 검증 실패
        "409":
          description: RUNNING 아님
  /openapi.yaml:
    get:
      summary: 이 YAML 정적 초안
      responses:
        "200":
          description: application/yaml
  /v1/datasets:
    get:
      summary: 입력 allowlist (보조 경로)
      description: >
        절대규칙 7 = D8′. 본경로는 Core 중개 수집(POST /v1/inputs)이고,
        allowlist 된 datasetId 는 데모·카탈로그 보조로 남는다.
      responses:
        "200":
          description: items[]
  /v1/ops/status:
    get:
      summary: 운영 한 눈 — 큐·lease·함대·증적·신원 합계
      description: >
        쓰기 없음 · 시크릿 없음. 판정(warnings·ok)까지 준다.
        기기 단위 분해는 GET /v1/ops/safety.
      responses:
        "200":
          description: 합계 + warnings + enforcement + db_pool
  /v1/ops/safety:
    get:
      summary: 안전 자세 — 「누가 내 데이터를 돌릴 수 있나」
      description: >
        기기 단위로 등급·조달 경로·증서(prefix·만료)·생사·받을 수 있는 요청 도메인·
        라우팅 가능한 (Agent, 능력) 쌍·위험 표시. routable_pairs 는 claim 의 후보
        조건을 그대로 센다 — 조회면과 배정이 갈라지지 않는다. developer 이상.
      responses:
        "200":
          description: totals · by_task_domain · nodes[] · warnings
        "401":
          description: 강제 모드에서 키 없음
        "403":
          description: 역할 부족
  /v1/api-keys:
    get:
      summary: 발급된 관리 키 상태 (prefix·역할만)
      description: >
        시크릿도 해시도 나가지 않는다. 발급은 API 로 하지 않는다 —
        첫 키를 만들 수 없어 잠기므로 CLI(app.apikey_cli)가 DB 에 직접 붙는다. admin 전용.
      responses:
        "200":
          description: items[]
        "401":
          description: 강제 모드에서 키 없음
        "403":
          description: 역할 부족
  /v1/nodes-credentials:
    get:
      summary: Node 별 증서 상태 (prefix 만)
      responses:
        "200":
          description: items[]
  /v1/nodes/{node_id}/credentials:
    post:
      summary: Node 증서 발급 — 평문은 이때 한 번만 나온다
      description: >
        등급 인자를 받지 않는다 (절대규칙 4). Node 당 활성 증서는 하나이므로
        회전은 폐기 후 재발급이다 (operate-node.md §2). admin 전용.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, nullable: true }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: secret(평문 1회) + prefix + 만료
        "409":
          description: 이미 활성 증서가 있다
  /v1/nodes/{node_id}/credentials/revoke:
    post:
      summary: Node 증서 폐기
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: 폐기됨
        "404":
          description: 활성 증서 없음
  /v1/inputs:
    post:
      summary: 입력 바이트 수집 (Core 중개 · D22)
      description: >
        raw body 를 디스크로 스트리밍한다. 크기·MIME 는 능력 계약이 정하고 DB 가 거절한다.
        입력은 수집 시점에 능력에 묶인다 (복합 FK) — 다른 능력의 입력은 못 쓴다.
      parameters:
        - name: capability_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: input_id · sha256 · byte_size · media_type
        "400":
          description: content-type 없음 · 선언되지 않은 MIME
        "404":
          description: capability 없음
        "413":
          description: 크기 계약 초과 (max_input_bytes)
  /v1/inputs/{input_id}:
    get:
      summary: 입력 메타 (바이트는 주지 않는다)
      parameters:
        - $ref: "#/components/parameters/InputId"
      responses:
        "200":
          description: sha256 · size · media_type · 보존 상태
        "404":
          description: 없음
  /v1/inputs/{input_id}/purge:
    post:
      summary: 바이트만 즉시 삭제 (행·해시는 남는다)
      description: 증적은 해시로 「어디로 갔는지」 답한다. 바이트는 휘발성이다.
      parameters:
        - $ref: "#/components/parameters/InputId"
      responses:
        "200":
          description: 삭제됨
        "404":
          description: 없음
  /v1/capabilities/{capability_id}/sample:
    post:
      summary: 계약 게이트용 샘플 입력을 능력에 붙인다
      description: >
        계약 게이트런은 샘플이 있어야 한다 — 없으면 DB 가 거절한다 (0013).
        샘플은 GC 대상에서 제외된다.
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input_id: { type: string, format: uuid }
      responses:
        "200":
          description: 붙었다
        "400":
          description: 다른 능력의 입력이다
        "404":
          description: 능력·입력 없음
  /v1/internal/capabilities/{capability_id}/sample:
    get:
      summary: 러너가 계약 검증용 샘플 메타를 가져간다
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 샘플 메타
        "404":
          description: 샘플 없음
  /v1/internal/inputs/{input_id}/bytes:
    get:
      summary: Node 가 자기 lease 의 입력 바이트를 가져간다
      description: >
        lease 를 확인한 뒤에만 준다. Node 는 받아서 해시를 대조하고, 실행 후 삭제한다.
      parameters:
        - $ref: "#/components/parameters/InputId"
      responses:
        "200":
          description: 바이트 스트림
        "403":
          description: 이 Node 의 배정이 아니다
        "404":
          description: 바이트 없음 (purge 됨)
  /v1/internal/agent-capabilities/revoke:
    post:
      summary: 증서 폐기 — 폐기된 증서로는 배정되지 않는다 (SD-014)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: { type: string, format: uuid }
                capability_id: { type: string, format: uuid }
                reason: { type: string }
      responses:
        "200":
          description: 폐기됨
        "409":
          description: 폐기 거부 (사슬 정합)
  /v1/internal/assignments/{assignment_id}/fail:
    post:
      summary: Node 가 실행 실패를 보고한다 (0015)
      description: >
        보고하면 배정은 즉시 FAILED, task 는 QUEUED 로 돌아가 다른 기기가 시도한다.
        보고가 없으면 실패가 lease 만료로만 드러난다. 이유는 audit_log 에 남는다.
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: 보고됨
        "403":
          description: 이 Node 의 배정이 아니다
        "404":
          description: 배정 없음 또는 이미 종결
  /v1/nodes/invites:
    post:
      summary: 초대장 발행 — 평문은 이때 한 번만 나온다 (G2)
      description: >
        **등급은 여기서 정해져 초대장에 박힌다.** 소진하는 쪽은 바꾸지 못한다 (절대규칙 4).
        team 은 초대로 만들 수 없다 — DB 가 거절한다. admin 전용.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trust_domain:
                  type: string
                  enum: [tenant, public]
                  default: tenant
                compute_tier_max: { type: string, enum: [L, M, S], default: M }
                label: { type: string, nullable: true }
                ttl_days: { type: integer, minimum: 1, maximum: 90, default: 7 }
                max_redemptions: { type: integer, minimum: 1, maximum: 100, default: 1 }
                # 초대로 들어온 기기가 속할 조직 (D24). 생략하면 발행자의 조직.
                # 등급과 마찬가지로 발행 시점에 박히며 소진하는 쪽이 바꾸지 못한다.
                org_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: secret(평문 1회) + prefix + 등급 + 만료
        "400":
          description: team 등급 요청 등 DB 가 거절한 조합
    get:
      summary: 초대장 상태 목록 (prefix·상태만)
      description: >
        USABLE · EXPIRED · REDEEMED · REVOKED. 시크릿도 해시도 나가지 않는다. admin 전용.
      responses:
        "200":
          description: items[]
  /v1/nodes/invites/{invite_id}/revoke:
    post:
      summary: 초대장 폐기
      parameters:
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, default: revoked }
      responses:
        "200":
          description: 폐기됨
        "404":
          description: 살아 있는 초대 없음
  /v1/nodes/redeem:
    post:
      summary: 초대를 소진해 Node + 증서를 받는다 (관리 키 불필요)
      description: >
        **이 경로만 관리 키 없이 열린다** — 초대받은 사람에게는 키가 없기 때문이다.
        초대 토큰 자체가 인증이다 (`Authorization: CapNet-Invite ci_….`).
        본문에 등급 필드가 **없다** — 초대장이 정한다 (절대규칙 4).
        소진 판정은 DB 의 조건부 UPDATE 가 한다: 만료·폐기·상한을 넘길 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                device_type:
                  type: string
                  enum: [PC_GPU, PHONE, SERVER]
                  default: PC_GPU
                gpu: { type: string, nullable: true }
      responses:
        "200":
          description: node + credential(평문 1회). node.org_id 는 **초대장이 정한 값**이다
        "401":
          description: 초대 토큰 없음 · 유효하지 않음 · 만료 · 폐기 · 소진됨
        "409":
          description: 이 Node 에 이미 활성 증서가 있다
components:
  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InputId:
      name: input_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GateRunId:
      name: gate_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AgentCreate:
      type: object
      required: [name, version, manifest_hash, weights_uri, weights_sha256]
      properties:
        name: { type: string }
        version: { type: string }
        manifest_hash: { type: string }
        weights_uri: { type: string }
        weights_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        weights_format: { type: string, enum: [safetensors], default: safetensors }
    NodeCreate:
      type: object
      required: [name, device_type, trust_domain, compute_tier_max]
      properties:
        name: { type: string }
        device_type: { type: string, enum: [PC_GPU, PHONE, SERVER] }
        trust_domain: { type: string, enum: [team, public] }
        compute_tier_max: { type: string, enum: [L, M, S] }
        is_gate_runner: { type: boolean, default: false }
        gpu: { type: string, nullable: true }
        provision_source: { type: string, nullable: true }
        # 조직 (D24 · 0017). 생략하면 팀 운영 공용 기기 — 모든 조직의 작업을 받는다.
        # Node 가 자기 소속을 주장하는 자리가 아니다 (절대규칙 4).
        org_id: { type: string, format: uuid, nullable: true }
    BindBody:
      type: object
      required: [node_id, weights_sha256_seen]
      properties:
        node_id: { type: string, format: uuid }
        weights_sha256_seen: { type: string }
    TaskCreate:
      type: object
      required: [datasetId, caseId]
      properties:
        datasetId: { type: string, example: eurosat-rgb }
        caseId: { type: string }
        capability_code: { type: string, default: image.classify }
        capability_version: { type: integer, default: 1 }
        requestedAgentId: { type: string, format: uuid, nullable: true }
    ClaimBody:
      type: object
      properties:
        task_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, format: uuid, nullable: true }
    CompleteBody:
      type: object
      required: [weights_sha256, label]
      properties:
        weights_sha256: { type: string }
        label: { type: string }
        confidence: { type: number, nullable: true }
        dummy: { type: boolean, default: true }
        duration_ms: { type: integer, nullable: true }
    GateStartBody:
      type: object
      required: [agent_id, capability_id, runner_node_id]
      properties:
        agent_id: { type: string, format: uuid }
        capability_id: { type: string, format: uuid }
        runner_node_id: { type: string, format: uuid }
    GateFinishBody:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PASSED, FAILED, ERROR] }
        golden_score: { type: number, nullable: true }
        cases_total: { type: integer, nullable: true }
        cases_passed: { type: integer, nullable: true }
        dummy: { type: boolean, default: false }
        note: { type: string, nullable: true }
        macro_f1: { type: number, nullable: true }
        invalid_rate: { type: number, nullable: true }
        min_per_class_recall:
          type: number
          nullable: true
          description: >
            계약이 min_per_class_recall 을 선언하면 실게이트 PASSED 에 필수.
            없거나 미달이면 거절된다 (라벨 공간 붕괴 차단).
        golden_set_sha256:
          type: string
          description: 실게이트 필수. gate_run 스냅샷과 불일치 시 거부 (S3).
          nullable: true
    CapabilityCreate:
      type: object
      required:
        - code
        - name
        - input_schema
        - output_schema
        - golden_set_ref
        - golden_set_sha256
        - golden_set_size
        - golden_metrics
      properties:
        code: { type: string }
        version: { type: integer, minimum: 1, default: 1 }
        name: { type: string }
        description: { type: string, nullable: true }
        input_schema: { type: object }
        output_schema: { type: object }
        output_kind:
          type: string
          enum: [closed_set_labels, structured, freeform]
          default: closed_set_labels
        compute_tier: { type: string, enum: [L, M, S], default: M }
        trust_domain_min: { type: string, enum: [team, tenant, public], default: team }
        mvp_eligible: { type: boolean, default: false }
        golden_set_ref: { type: string }
        golden_set_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        golden_set_size: { type: integer, minimum: 1 }
        golden_metrics: { type: object }
