services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capnet}
      POSTGRES_DB: ${POSTGRES_DB:-capnet}
    ports:
      - "5432:5432"
    volumes:
      - capnet_pg:/var/lib/postgresql/data
      - ./docs/spec/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./apps/core/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capnet} -d ${POSTGRES_DB:-capnet}"]
      interval: 3s
      timeout: 5s
      retries: 20

  # 새 볼륨은 initdb 가 schema.sql 을 넣지만 거기서 멈춘다 — 그 뒤 세대는 migrations/ 에 있다.
  # 이 일회성 서비스가 그 간극을 메운다. 앱 기동 시 자동 DDL 이 아니라 **명시적 단계**로 둔 것은
  # 제품 배포에서 마이그레이션 시점을 운영자가 잡아야 하기 때문이다 (CAPNET_AUTO_MIGRATE=0 으로 끈다).
  migrate:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://capnet:capnet@postgres:5432/capnet}
      CAPNET_AUTO_MIGRATE: ${CAPNET_AUTO_MIGRATE:-1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # postgres 헬스체크는 initdb 중에도 유닉스 소켓으로 통과할 수 있다 (그때 TCP 는 아직 닫혀 있다).
    # 그래서 healthy 만 믿지 않고, baseline 이 실제로 보일 때까지 기다린 뒤 적용한다.
    # status 는 _assert_baseline 을 타므로 schema.sql 이 들어오기 전에는 0 을 주지 않는다.
    command:
      - sh
      - -c
      - |
        [ "$${CAPNET_AUTO_MIGRATE:-1}" = "1" ] || {
          echo "migrate 건너뜀 (CAPNET_AUTO_MIGRATE=$${CAPNET_AUTO_MIGRATE})"; exit 0; }
        for i in $$(seq 1 60); do
          python -m app.migrate status >/dev/null 2>&1 && break
          sleep 1
        done
        exec python -m app.migrate up

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://capnet:capnet@postgres:5432/capnet}
    ports:
      - "${CORE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  node-m-team:
    build:
      context: .
      dockerfile: apps/node/Dockerfile
      args:
        INSTALL_TORCH: "true"
    environment:
      CORE_URL: http://core:8000
      WEIGHTS_DIR: /weights
      WEIGHTS_PATH: /weights/placeholder.safetensors
      GOLDEN_CASES_DIR: /golden/cases
      NODE_ROLE: m-team
      # seed 의 team gate-runner. Core가 배정한 lease만 가져간다.
      NODE_ID: "00000000-0000-4000-8000-000000000030"
    volumes:
      - ./apps/node/weights:/weights:ro
      - ./docs/spec/golden/cases:/golden/cases:ro
      - ./docs/spec/golden/manifest-image-classify-v1.json:/golden/manifest-image-classify-v1.json:ro
    ports:
      - "${NODE_PORT:-8001}:8001"
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      - core

  node-s-team:
    build:
      context: .
      dockerfile: apps/node/Dockerfile
    environment:
      CORE_URL: http://core:8000
      WEIGHTS_PATH: /weights/placeholder.safetensors
      NODE_ROLE: s-team
    ports:
      - "8002:8001"
    mem_limit: 256m
    cpus: 0.50
    depends_on:
      - core

  node-s-public:
    build:
      context: .
      dockerfile: apps/node/Dockerfile
    environment:
      CORE_URL: http://core:8000
      WEIGHTS_PATH: /weights/placeholder.safetensors
      NODE_ROLE: s-public
    ports:
      - "8003:8001"
    mem_limit: 256m
    cpus: 0.50
    depends_on:
      - core

volumes:
  capnet_pg:
